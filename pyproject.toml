[project]
name = "autonomous-cae"
version = "0.1.0"
description = "Multi-agent CAD/CAE pipeline: AI-instructed build123d B-rep generation with ParaView/PyVista inspection (Stage 1)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "build123d>=0.9",
    "pyvista>=0.44",
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.1",
    "langchain-anthropic>=0.3",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "pillow>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
autonomous-cae = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
only-include = ["src", "main.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
